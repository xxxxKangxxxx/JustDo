version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - npm ci --include=dev
            - cd apps/web
        build:
          commands:
            # Amplify Hosting injects env vars into the build shell, but not
            # into the SSR Lambda runtime. Persist only the Supabase server
            # credential and native Apple revocation credentials used by
            # server-only routes. Billing is disabled for the full-free launch,
            # so payment secrets must not enter the bundle.
            # NEXT_PUBLIC_* values are already inlined client/server by
            # Next.js's normal env handling.
            - printenv | grep -E "^(SUPABASE_SERVICE_ROLE_KEY|APPLE_NATIVE_CLIENT_ID|APPLE_SIGN_IN_TEAM_ID|APPLE_SIGN_IN_KEY_ID|APPLE_SIGN_IN_PRIVATE_KEY_BASE64)=" > .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
